<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title }} · {{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta name="twitter:card" content="summary">
    <title>{{ page.title }} · {{ site.title }}</title>
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Kex documentation home">Kex<span aria-hidden="true">█</span></a>
      <a href="https://github.com/mikker/Dinky">GITHUB ↗</a>
    </header>

    <div class="shell">
      <aside aria-label="Documentation sections">
        <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">00 / Introduction</a>
        <a {% if page.url contains '/configuration/' %}aria-current="page"{% endif %} href="{{ '/configuration/' | relative_url }}">01 / Configuration</a>
        <a {% if page.url contains '/commands/' %}aria-current="page"{% endif %} href="{{ '/commands/' | relative_url }}">02 / Commands</a>
        <a {% if page.url contains '/changelog/' %}aria-current="page"{% endif %} href="{{ '/changelog/' | relative_url }}">03 / Changelog</a>
      </aside>

      <main id="content">
        {{ content }}
      </main>
    </div>
  </body>
</html>
